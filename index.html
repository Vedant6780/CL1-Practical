<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrightStart Landing Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fff8ed;
      color: #22312f;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px min(6vw, 72px);
      background: #ffffff;
      border-bottom: 1px solid #f0dfc3;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0d6b61;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: #425653;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #0d6b61;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 460px);
      gap: 48px;
      align-items: center;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0;
    }

    .hero-copy {
      max-width: 620px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #cc5c32;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.3rem, 5vw, 4.6rem);
      line-height: 1;
    }

    p {
      margin: 0 0 28px;
      max-width: 560px;
      color: #526561;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    button,
    .button-link {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button {
      background: #0d6b61;
      color: #ffffff;
    }

    button:hover {
      background: #084d46;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      color: #0d6b61;
      background: #dff3ed;
      text-decoration: none;
    }

    form {
      display: grid;
      gap: 12px;
      max-width: 460px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #f0dfc3;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(34, 49, 47, 0.09);
    }

    label {
      display: grid;
      gap: 6px;
      color: #314743;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #c8d8d3;
      border-radius: 6px;
      padding: 0 12px;
      color: #22312f;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #b9e7dd;
      border-color: #0d6b61;
    }

    .image-panel {
      overflow: hidden;
      border-radius: 8px;
      background: #0d6b61;
      box-shadow: 0 22px 55px rgba(34, 49, 47, 0.18);
    }

    .image-panel img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
    }

    @media (max-width: 820px) {
      nav,
      .nav-links,
      main {
        align-items: flex-start;
      }

      nav {
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
        padding: 42px 0;
      }

      .image-panel img {
        aspect-ratio: 16 / 10;
      }
    }

    @media (max-width: 520px) {
      .nav-links {
        flex-wrap: wrap;
      }

      .actions,
      button,
      .button-link {
        width: 100%;
      }

      .button-link {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <div class="logo">BrightStart</div>
    <ul class="nav-links">
      <li><a href="#features">Features</a></li>
      <li><a href="#signup">Signup</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section class="hero-copy">
      <p class="eyebrow">Plan better days</p>
      <h1>Build a brighter morning routine.</h1>
      <p>
        A simple landing page with fresh colors, a navigation bar, an image,
        a button, and a quick signup form.
      </p>

      <div class="actions">
        <button type="button">Get Started</button>
        <a class="button-link" href="#signup">Join the list</a>
      </div>

      <form id="signup">
        <label>
          Your name
          <input type="text" name="name" placeholder="Bipin" required>
        </label>
        <label>
          Email address
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <button type="submit">Send me updates</button>
      </form>
    </section>

    <aside class="image-panel" aria-label="Morning workspace image">
      <img
        src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=900&q=80"
        alt="A neat desk with a notebook, laptop, and coffee"
      >
    </aside>
  </main>
</body>
</html>
